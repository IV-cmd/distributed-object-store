x-fst: &fst
  image: distributed-object-store:dev
  build:
    context: ..
    dockerfile: docker/Dockerfile
  init: true
  environment:
    HEARTBEAT_INTERVAL_MS: "${HEARTBEAT_INTERVAL_MS:-2000}"
  depends_on:
    - mgm

services:
  mgm:
    image: distributed-object-store:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    command: [mgm, "0.0.0.0:50051"]
    environment:
      HEARTBEAT_TIMEOUT_MS: "${HEARTBEAT_TIMEOUT_MS:-6000}"
      REPAIR_INTERVAL_MS: "${REPAIR_INTERVAL_MS:-500}"
    ports:
      - "127.0.0.1:${MGM_PORT:-50051}:50051"

  fst1:
    <<: *fst
    command: [fst, "0.0.0.0:50052", /var/lib/objectstore, "mgm:50051", fst1, "fst1:50052"]
    volumes:
      - fst1-data:/var/lib/objectstore

  fst2:
    <<: *fst
    command: [fst, "0.0.0.0:50052", /var/lib/objectstore, "mgm:50051", fst2, "fst2:50052"]
    volumes:
      - fst2-data:/var/lib/objectstore

  fst3:
    <<: *fst
    command: [fst, "0.0.0.0:50052", /var/lib/objectstore, "mgm:50051", fst3, "fst3:50052"]
    volumes:
      - fst3-data:/var/lib/objectstore

  fst4:
    <<: *fst
    command: [fst, "0.0.0.0:50052", /var/lib/objectstore, "mgm:50051", fst4, "fst4:50052"]
    volumes:
      - fst4-data:/var/lib/objectstore

  client:
    image: distributed-object-store:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: [tools]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      MGM_ADDRESS: mgm:50051
    volumes:
      - ../.objectstore-files:/files
    entrypoint: [client]
    command: [ls]
    depends_on:
      - mgm

volumes:
  fst1-data:
  fst2-data:
  fst3-data:
  fst4-data:

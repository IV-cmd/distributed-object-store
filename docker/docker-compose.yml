services:
  fst:
    image: distributed-object-store:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    command: [fst, "0.0.0.0:50052", /var/lib/objectstore]
    ports:
      - "127.0.0.1:${FST_PORT:-50052}:50052"
    volumes:
      - object-data:/var/lib/objectstore

volumes:
  object-data:

name: Extended checks

on:
  workflow_dispatch:
    inputs:
      check:
        description: Optional check to run
        type: choice
        required: true
        default: static-analysis
        options:
          - static-analysis
          - clang
          - compose
          - demo
          - chaos
          - bench
          - proof

permissions:
  contents: read

jobs:
  verify:
    name: Manual ${{ inputs.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: inputs.check == 'clang' || inputs.check == 'static-analysis'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 cmake ninja-build \
            libgrpc++-dev libprotobuf-dev protobuf-compiler \
            protobuf-compiler-grpc libgtest-dev libxxhash-dev
      - name: Configure
        if: inputs.check == 'clang' || inputs.check == 'static-analysis'
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18
      - name: Clang build and tests
        if: inputs.check == 'clang'
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Static analysis
        if: inputs.check == 'static-analysis'
        run: |
          cmake --build build --target objectstore_proto --parallel 2
          git ls-files -z '*.cc' | xargs -0 clang-tidy-18 -p build
      - name: Failure-recovery Compose smoke
        if: inputs.check == 'compose'
        run: |
          set -o pipefail
          ./scripts/smoke.sh 2>&1 | tee compose-smoke.log
      - name: Save Compose evidence
        if: always() && inputs.check == 'compose'
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke
          path: compose-smoke.log
      - name: Demo, chaos, and benchmark proof
        if: contains(fromJSON('["demo", "chaos", "bench", "proof"]'), inputs.check)
        env:
          PROOF_CHECK: ${{ inputs.check }}
        run: |
          set -o pipefail
          targets=("$PROOF_CHECK")
          if [[ "$PROOF_CHECK" == proof ]]; then targets=(demo chaos bench); fi
          for target in "${targets[@]}"; do
            make "$target" 2>&1 | tee "$target.log"
          done
      - name: Save proof evidence
        if: always() && contains(fromJSON('["demo", "chaos", "bench", "proof"]'), inputs.check)
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ inputs.check }}
          include-hidden-files: true
          path: |
            .proof-results/
            demo.log
            chaos.log
            bench.log

name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: GCC tests and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang-format-18 cmake ninja-build \
            libgrpc++-dev libprotobuf-dev protobuf-compiler \
            protobuf-compiler-grpc libgtest-dev libxxhash-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Harness unit tests and syntax
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m compileall -q scripts
          bash -n scripts/*.sh
      - name: Check format
        run: |
          git ls-files -z '*.cc' '*.h' | xargs -0 clang-format-18 -i
          git diff --exit-code

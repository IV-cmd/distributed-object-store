syntax = "proto3";

package objectstore.v1;

import "google/protobuf/empty.proto";

service MgmService {
  rpc AllocateChunk(ChunkId) returns (ReplicaPlan);
  rpc CommitChunk(CommitChunkRequest) returns (google.protobuf.Empty);
  rpc LocateChunk(ChunkId) returns (ChunkMetadata);
  rpc StatFile(ObjectRequest) returns (FileMetadata);
  rpc ListFiles(google.protobuf.Empty) returns (FileList);
  rpc CompleteFile(ObjectRequest) returns (google.protobuf.Empty);
  rpc DeleteFile(ObjectRequest) returns (google.protobuf.Empty);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ListNodes(google.protobuf.Empty) returns (NodeList);
  rpc ReportChunkStatus(ReportChunkStatusRequest) returns (google.protobuf.Empty);
}

service FstService {
  rpc CopyChunk(CopyChunkRequest) returns (google.protobuf.Empty);
  rpc InstallChunk(InstallChunkRequest) returns (google.protobuf.Empty);
  rpc BeginObject(BeginObjectRequest) returns (google.protobuf.Empty);
  rpc FinishObject(ObjectRequest) returns (google.protobuf.Empty);
  rpc GetObjectInfo(ObjectRequest) returns (ObjectInfo);
  rpc DeleteObject(ObjectRequest) returns (google.protobuf.Empty);
  rpc WriteChunk(WriteChunkRequest) returns (google.protobuf.Empty);
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (google.protobuf.Empty);
  rpc Scrub(google.protobuf.Empty) returns (ScrubResponse);
}

message ChunkId {
  string object_id = 1;
  uint32 index = 2;
}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  UP = 1;
  DOWN = 2;
  REJOINING = 3;
}

message NodeInfo {
  string node_id = 1;
  string endpoint = 2;
  uint64 capacity_bytes = 3;
  NodeState state = 4;
  uint64 chunk_count = 5;
  uint64 free_bytes = 6;
  uint64 incarnation = 7;
}

message ChunkLocation {
  ChunkId chunk = 1;
  NodeInfo node = 2;
}

message PlacementPlan {
  repeated ChunkLocation chunks = 1;
}

message ChunkStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    HEALTHY = 1;
    MISSING = 2;
    CORRUPT = 3;
  }
  ChunkId chunk = 1;
  State state = 2;
  fixed64 checksum = 3;
  uint64 size_bytes = 4;
}

message PutRequest {
  string object_id = 1;
  uint64 size_bytes = 2;
  string name = 3;
}

message PutResponse {
  PlacementPlan plan = 1;
}

message GetRequest {
  string object_id = 1;
}

message GetResponse {
  PlacementPlan plan = 1;
}

message RegisterNodeRequest {
  NodeInfo node = 1;
}

message RegisterNodeResponse {
  bool accepted = 1;
}

message HeartbeatRequest {
  string node_id = 1;
  string endpoint = 2;
  uint64 chunk_count = 3;
  uint64 free_bytes = 4;
}

message HeartbeatResponse {
  bool report_inventory = 1;
  uint64 incarnation = 2;
}

message NodeList {
  repeated NodeInfo nodes = 1;
}

message ReportChunkStatusRequest {
  string node_id = 1;
  repeated ChunkStatus chunks = 2;
  string endpoint = 3;
  uint64 incarnation = 4;
}

message WriteChunkRequest {
  ChunkId chunk = 1;
  bytes data = 2;
  fixed64 checksum = 3;
}

message ReadChunkRequest {
  ChunkId chunk = 1;
}

message ReadChunkResponse {
  bytes data = 1;
  fixed64 checksum = 2;
}

message DeleteChunkRequest {
  ChunkId chunk = 1;
}

message ScrubResponse {
  repeated ChunkStatus chunks = 1;
}

message ObjectRequest {
  string object_id = 1;
}

message BeginObjectRequest {
  string object_id = 1;
  uint64 size_bytes = 2;
}

message ObjectInfo {
  uint64 size_bytes = 1;
  uint32 chunk_count = 2;
}

message ReplicaPlan {
  repeated NodeInfo nodes = 1;
}

message CommitChunkRequest {
  ChunkId chunk = 1;
  repeated string node_ids = 2;
  fixed64 checksum = 3;
}

message ChunkMetadata {
  ChunkId chunk = 1;
  repeated NodeInfo replicas = 2;
  fixed64 checksum = 3;
  bool committed = 4;
  repeated NodeInfo known_replicas = 5;
  repeated string invalid_replicas = 6;
}

message FileMetadata {
  string object_id = 1;
  string name = 2;
  uint64 size_bytes = 3;
  uint32 chunk_count = 4;
  bool complete = 5;
  repeated ChunkMetadata chunks = 6;
  repeated NodeInfo targets = 7;
  uint64 generation = 8;
}

message FileList {
  repeated FileMetadata files = 1;
}

message CopyChunkRequest {
  ChunkId chunk = 1;
  NodeInfo target = 2;
  fixed64 checksum = 3;
  uint64 size_bytes = 4;
}

message InstallChunkRequest {
  WriteChunkRequest write = 1;
  uint64 size_bytes = 2;
}
